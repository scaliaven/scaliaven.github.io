- title: Research Experience
  type: time_table
  contents:
    - title: Physics-Informed Vision-Language-Action Models
      institution: University of Maryland, College Park
      department: Independent research · Advised by Prof. Furong Huang and Prof. Tianyi Zhou
      year: 2025–
      location: Maryland, US
      description:
        - Integrating trajectory planning directly into the action-prediction objective of VLA models.
        - Proposed a general method for fusing a 3D spatial encoder with a 2D vision encoder to aid action-prediction training via future latent alignment.
        - Implemented a cascaded pipeline in which a predicted future trace conditions the downstream action predictor.
    - title: Physics-Informed Video Diffusion Models
      institution: New York University Shanghai
      department: Independent research · Advised by Prof. Shengjie Wang (NYU Shanghai) and Prof. Tianyi Zhou (UMD)
      year: 2024–
      location: Shanghai, China
      description:
        - Adapting pretrained video diffusion models with lightweight modifications so that generated video obeys physical laws, while keeping training efficient and inference fast.
        - Used 3D physics engines (Genesis) to generate supervised training data.
        - Modified ControlNeXt to condition generation on physical constraints.
    - title: Atomic Environment Imaging for Efficient Machine-Learning Force Fields
      institution: New York University Shanghai
      department: Independent research · Advised by Prof. Shengjie Wang
      year: 2025
      location: Shanghai, China
      description:
        - Using 3D visualizations of molecular structure to improve force-field prediction models.
        - Built a general pipeline that renders predefined multi-view images of the local environment centered on each atom.
        - Added image encoders for models with direct force prediction, and coordinate encoders that reconstruct those images for gradient-based models that take only coordinates as input.
    - title: Efficient Training for Small-Molecule Force Fields
      institution: New York University Shanghai
      department: Independent research · Advised by Prof. Shengjie Wang (NYU Shanghai) and Prof. Tianyi Zhou (UMD)
      year: 2024–25
      location: Shanghai, China
      description:
        - Generated large pools of low-precision molecular dynamics samples, then used submodular selection to pick diverse conformations for recomputation at high precision.
        - Showed that training GemNet on points chosen by similarity-based submodular functions outperforms both random and equal-timestep sampling.
        - Implemented graph VAEs to learn geometry-aware features for submodular selection, and adapted EGNN to predict a coarse force field, yielding force-field-aware selection features.

- title: Selected Projects
  type: time_table
  contents:
    - title: Cost-Aware Finetuning of Language Models for Chemical Reaction Prediction
      department: Final project, Natural Language Processing with Representation Learning (graduate)
      year: 2024
      description:
        - Finetuned pretrained BART-based models for chemical reaction prediction under a compute budget.
        - Constructed USPTO-50K_γ, a dataset pairing LLM-generated predictions with experimental data.
        - Compared finetuning strategies, including a from-scratch LoRA implementation.
      linkitems:
        - link: /assets/pdf/NLP_final.pdf
          linkname: report
    - title: Popularity Prediction of YouTube Videos
      institution: New York University Shanghai
      department: Summer research, advised by Prof. Xianbin Gu
      year: 2023
      location: Shanghai, China
      description:
        - Applied the SlowFast action-recognition model to derive action labels for downstream prediction.
        - Trained an MLP over visual features and the first seven days of view counts to predict total views at 30 days.

