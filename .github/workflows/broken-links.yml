name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2.1.0
        with:
          fail: true
          # removed md files that include liquid tags
          # 403/429 are publisher/CDN bot walls (Elsevier, Cloudflare), not broken links.
          # _pages/{publications,teaching,profiles,dropdown}.md are in _config.yml exclude: and never built.
          args: --user-agent 'curl/7.54' --accept '200,206,403,429' --exclude-path README.md --exclude-path FAQ.md --exclude-path _pages/404.md --exclude-path _pages/blog.md --exclude-path _pages/publications.md --exclude-path _pages/teaching.md --exclude-path _pages/profiles.md --exclude-path _pages/dropdown.md --verbose --no-progress './**/*.md' './**/*.html' './_bibliography/*.bib' './_data/*.yml'
