name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2.1.0
        with:
          fail: true
          # The action defaults to lychee v0.17.0, which predates --root-dir.
          # Pinned to the version this arg set was verified against.
          lycheeVersion: v0.24.2
          # removed md files that include liquid tags
          # 403/429 are publisher/CDN bot walls (Elsevier, Cloudflare) and 202 is figshare's
          # DOI resolver -- none are broken links. --root-dir resolves root-relative asset
          # paths like /assets/pdf/IMM.pdf against the checkout.
          # _pages/{publications,teaching,profiles,dropdown}.md are in _config.yml exclude: and never built.
          args: --user-agent 'curl/7.54' --accept '200,202,206,403,429' --root-dir . --exclude-path README.md --exclude-path FAQ.md --exclude-path INSTALL.md --exclude-path _pages/about_einstein.md --exclude-path _pages/404.md --exclude-path _pages/blog.md --exclude-path _pages/publications.md --exclude-path _pages/teaching.md --exclude-path _pages/profiles.md --exclude-path _pages/dropdown.md --verbose --no-progress './**/*.md' './**/*.html' './_bibliography/*.bib' './_data/*.yml'
